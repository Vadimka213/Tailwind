<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Картка товару</title>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">

    <div class="bg-white rounded-xl shadow-lg overflow-hidden w-80">
        <div class="relative">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600"
                 alt="Навушники"
                 class="w-full aspect-video object-cover">

            <span class="absolute top-3 left-3 bg-green-500 text-white text-sm px-3 py-1 rounded-full">
                Новинка
            </span>
        </div>

        <div class="p-5">
            <h2 class="text-xl font-bold mb-2">Бездротові навушники</h2>

            <div class="flex items-center gap-3 mb-4">
                <span class="text-gray-400 line-through">2499 грн</span>
                <span class="text-2xl font-bold text-blue-600">1999 грн</span>
            </div>

            <button class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition">
                В кошик
            </button>
        </div>
    </div>

</body>
</html>
